# 发布：pubspec.yaml 里的版本号一变，就打 APK + IPA 并建一条 Release，
# 发布说明就是这个版本改了什么（工具脚本：tool/release.py）。
#
# 触发方式：
#   1. 改 pubspec.yaml 的 version 并推到 main（`just bump 1.2.0` 会顺手改好）；
#   2. Actions 页面手动 Run workflow，可临时指定版本号与更新说明。
# 若同名标签 v<版本号> 已存在，默认什么都不做；勾上「强制重新发布」才会重打。
name: 发布（APK + IPA）

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 1.2.0），留空则用 pubspec.yaml 里的
        required: false
        type: string
      notes:
        description: 自定义更新说明（留空则自动从上个标签以来的提交生成）
        required: false
        type: string
      force:
        description: 同名标签已存在时也重新发布
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只跑一版；排队而不是打断，免得半路把 Release 覆盖掉
concurrency:
  group: release
  cancel-in-progress: false

env:
  # 与本地一致，避免 stable 漂移把发布构建带跑偏
  FLUTTER_VERSION: 3.47.8

jobs:
  prepare:
    name: 读取版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成发布说明要用历史提交与标签

      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current=$(python3 tool/release.py version)   # 1.0.0+1
          build=${current#*+}
          version=${INPUT_VERSION:-${current%+*}}
          tag="v${version}"

          if [ -n "$(git tag --list "$tag")" ] && [ "${INPUT_FORCE}" != "true" ]; then
            publish=false
            echo "::notice::标签 $tag 已存在，本次跳过（需要重发请勾选「强制重新发布」）"
          else
            publish=true
          fi

          case "$version" in
            *-*) prerelease=true ;;   # 1.2.0-beta.1 之类按预发布发布
            *)   prerelease=false ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          {
            echo "### 发布计划"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`$version\`（构建号 $build） |"
            echo "| 标签 | \`$tag\` |"
            echo "| 是否发布 | $publish |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 格式 / 分析 / 测试
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  apk:
    name: 构建 APK
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 构建
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/free-clac-$VERSION.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  ipa:
    name: 构建 IPA（未签名）
    needs: [prepare, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 仓库里没有签名证书，只能出未签名包：自签（Sideloadly / AltStore）后才能装
      - name: 构建
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name "$VERSION" --build-number "$BUILD"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          mkdir -p dist
          ( cd build/ipa && zip -qry "$GITHUB_WORKSPACE/dist/free-clac-$VERSION.ipa" Payload )
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: 创建 Release
    needs: [prepare, apk, ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 发布说明里要数上一个标签以来的提交

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成发布说明
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python3 tool/release.py notes --version "$VERSION" --notes "$NOTES" --out RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Magic 计算器 ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            dist/*.apk
            dist/*.ipa
          fail_on_unmatched_files: true
